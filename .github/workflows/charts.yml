name: Chart checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified calendar dependency
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run five chart tests
        run: python -m unittest -v test_chart
      - name: Run public examples
        run: |
          python chart.py qimen 1995-05-07T20:00:00+08:00
          python chart.py ziwei 2000-02-05T12:00:00+08:00 --sex 女
          python chart.py dates 2000-01-01 2000-01-31 子
